<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="impactoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fundo -->
  <circle cx="24" cy="24" r="22" fill="url(#impactoGradient)" opacity="0.1"/>
  
  <!-- Pessoas em círculo representando impacto social -->
  <g transform="translate(24,24)" fill="url(#impactoGradient)">
    <!-- Pessoa central -->
    <circle cx="0" cy="-3" r="3"/>
    <rect x="-2" y="1" width="4" height="6" rx="2"/>
    
    <!-- Pessoas ao redor (impacto) -->
    <g opacity="0.8">
      <!-- Pessoa 1 (direita) -->
      <circle cx="8" cy="-3" r="2"/>
      <rect x="7" y="0" width="2" height="4" rx="1"/>
      
      <!-- Pessoa 2 (esquerda) -->
      <circle cx="-8" cy="-3" r="2"/>
      <rect x="-8" y="0" width="2" height="4" rx="1"/>
      
      <!-- Pessoa 3 (abaixo direita) -->
      <circle cx="6" cy="5" r="2"/>
      <rect x="5" y="8" width="2" height="4" rx="1"/>
      
      <!-- Pessoa 4 (abaixo esquerda) -->
      <circle cx="-6" cy="5" r="2"/>
      <rect x="-6" y="8" width="2" height="4" rx="1"/>
    </g>
    
    <!-- Ondas de impacto -->
    <g stroke="url(#impactoGradient)" stroke-width="1.5" fill="none" opacity="0.6">
      <circle cx="0" cy="0" r="12"/>
      <circle cx="0" cy="0" r="16"/>
    </g>
    
    <!-- Coração central simbolizando cuidado social -->
    <path d="M-3,-8 C-4,-10 -6,-10 -6,-7 C-6,-5 -3,-2 0,1 C3,-2 6,-5 6,-7 C6,-10 4,-10 3,-8 C2,-9 1,-9 0,-8 C-1,-9 -2,-9 -3,-8 Z" fill="#EF4444" opacity="0.9"/>
  </g>
</svg>