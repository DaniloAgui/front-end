<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradEducacao" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Livro base -->
  <rect x="3" y="6" width="14" height="11" rx="1" fill="url(#gradEducacao)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  
  <!-- Páginas do livro -->
  <rect x="4" y="7" width="12" height="1" fill="rgba(255,255,255,0.4)" rx="0.2"/>
  <rect x="4" y="9" width="12" height="1" fill="rgba(255,255,255,0.3)" rx="0.2"/>
  <rect x="4" y="11" width="8" height="1" fill="rgba(255,255,255,0.3)" rx="0.2"/>
  
  <!-- Marca-página -->
  <rect x="8" y="3" width="1.5" height="4" fill="#ff6b6b" rx="0.2"/>
  <polygon points="8.75,3 9.5,4 8.75,3.8 8,4" fill="#ff6b6b"/>
  
  <!-- Chapéu de formatura -->
  <rect x="11" y="2" width="6" height="1" fill="#28a745" rx="0.5"/>
  <circle cx="14" cy="2.5" r="2" fill="#28a745" opacity="0.8"/>
  <rect x="13.5" y="1" width="1" height="2" fill="#ffc107"/>
  <circle cx="14" cy="0.8" r="0.3" fill="#ffc107"/>
  
  <!-- Efeitos de brilho -->
  <ellipse cx="10" cy="4" rx="6" ry="1" fill="rgba(255,255,255,0.1)"/>
  <circle cx="6" cy="8" r="0.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="14" cy="10" r="0.3" fill="rgba(255,255,255,0.3)"/>
</svg>