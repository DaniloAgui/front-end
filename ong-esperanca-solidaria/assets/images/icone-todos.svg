<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="allGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo principal -->
  <circle cx="12" cy="12" r="10" fill="url(#allGradient)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Grade 3x3 representando "todos" -->
  <g transform="translate(12,12)" fill="#ffffff">
    <!-- Linha superior -->
    <circle cx="-3" cy="-3" r="1.5"/>
    <circle cx="0" cy="-3" r="1.5"/>
    <circle cx="3" cy="-3" r="1.5"/>
    
    <!-- Linha do meio -->
    <circle cx="-3" cy="0" r="1.5"/>
    <circle cx="0" cy="0" r="1.5"/>
    <circle cx="3" cy="0" r="1.5"/>
    
    <!-- Linha inferior -->
    <circle cx="-3" cy="3" r="1.5"/>
    <circle cx="0" cy="3" r="1.5"/>
    <circle cx="3" cy="3" r="1.5"/>
  </g>
</svg>