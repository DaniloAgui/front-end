<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="voluntarioGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fundo -->
  <circle cx="32" cy="32" r="30" fill="url(#voluntarioGradient)" opacity="0.1"/>
  
  <!-- Pessoa voluntária -->
  <g transform="translate(32,32)">
    <!-- Cabeça -->
    <circle cx="0" cy="-12" r="6" fill="url(#voluntarioGradient)"/>
    
    <!-- Corpo -->
    <rect x="-4" y="-6" width="8" height="16" rx="4" fill="url(#voluntarioGradient)"/>
    
    <!-- Braços estendidos (ajudando) -->
    <rect x="-12" y="-4" width="8" height="4" rx="2" fill="url(#voluntarioGradient)"/>
    <rect x="4" y="-4" width="8" height="4" rx="2" fill="url(#voluntarioGradient)"/>
    
    <!-- Pernas -->
    <rect x="-2" y="10" width="4" height="8" rx="2" fill="url(#voluntarioGradient)"/>
    
    <!-- Colete de voluntário -->
    <rect x="-3" y="-5" width="6" height="8" rx="1" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    
    <!-- Cruz de ajuda no peito -->
    <g fill="#ffffff" opacity="0.9">
      <rect x="-0.5" y="-3" width="1" height="4"/>
      <rect x="-2" y="-1.5" width="4" height="1"/>
    </g>
    
    <!-- Mãos ajudando outras pessoas (representadas por círculos menores) -->
    <g opacity="0.8">
      <!-- Pessoa à esquerda sendo ajudada -->
      <circle cx="-16" cy="0" r="3" fill="url(#voluntarioGradient)" opacity="0.6"/>
      <rect x="-17" cy="3" width="2" height="4" rx="1" fill="url(#voluntarioGradient)" opacity="0.6"/>
      
      <!-- Pessoa à direita sendo ajudada -->
      <circle cx="16" cy="2" r="3" fill="url(#voluntarioGradient)" opacity="0.6"/>
      <rect x="15" y="5" width="2" height="4" rx="1" fill="url(#voluntarioGradient)" opacity="0.6"/>
    </g>
    
    <!-- Estrelas de impacto positivo -->
    <g fill="#FFD700" opacity="0.8">
      <path d="M-8,-16 L-7,-14 L-5,-14 L-6.5,-12.5 L-6,-10 L-8,-11 L-10,-10 L-9.5,-12.5 L-11,-14 L-9,-14 Z"/>
      <path d="M8,-14 L9,-12 L11,-12 L9.5,-10.5 L10,-8 L8,-9 L6,-8 L6.5,-10.5 L5,-12 L7,-12 Z"/>
    </g>
  </g>
</svg>