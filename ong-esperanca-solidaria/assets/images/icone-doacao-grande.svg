<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="doacaoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fundo -->
  <circle cx="32" cy="32" r="30" fill="url(#doacaoGradient)" opacity="0.1"/>
  
  <!-- Mão estendida (doando) -->
  <g transform="translate(32,32)">
    <!-- Base da mão -->
    <ellipse cx="-5" cy="0" rx="8" ry="12" fill="url(#doacaoGradient)" opacity="0.8"/>
    
    <!-- Dedos -->
    <rect x="-12" y="-8" width="3" height="8" rx="1.5" fill="url(#doacaoGradient)"/>
    <rect x="-8" y="-10" width="3" height="10" rx="1.5" fill="url(#doacaoGradient)"/>
    <rect x="-4" y="-9" width="3" height="9" rx="1.5" fill="url(#doacaoGradient)"/>
    <rect x="0" y="-7" width="3" height="7" rx="1.5" fill="url(#doacaoGradient)"/>
    
    <!-- Moedas saindo da mão -->
    <g opacity="0.9">
      <circle cx="8" cy="-12" r="3" fill="#FFD700" stroke="url(#doacaoGradient)" stroke-width="1"/>
      <text x="8" y="-9" text-anchor="middle" fill="url(#doacaoGradient)" font-family="serif" font-size="4" font-weight="bold">$</text>
      
      <circle cx="12" cy="-8" r="2.5" fill="#FFD700" stroke="url(#doacaoGradient)" stroke-width="1"/>
      <text x="12" y="-6" text-anchor="middle" fill="url(#doacaoGradient)" font-family="serif" font-size="3" font-weight="bold">$</text>
      
      <circle cx="15" cy="-4" r="2" fill="#FFD700" stroke="url(#doacaoGradient)" stroke-width="1"/>
      <text x="15" y="-2.5" text-anchor="middle" fill="url(#doacaoGradient)" font-family="serif" font-size="2" font-weight="bold">$</text>
    </g>
    
    <!-- Coração representando amor/caridade -->
    <path d="M-15,8 C-17,5 -20,5 -20,9 C-20,12 -15,17 -10,20 C-5,17 0,12 0,9 C0,5 -3,5 -5,8 C-6,6 -8,6 -10,8 C-12,6 -14,6 -15,8 Z" fill="#EF4444" opacity="0.8"/>
    
    <!-- Setas indicando fluxo de doação -->
    <g stroke="url(#doacaoGradient)" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M5,-5 Q10,-8 15,-5"/>
      <path d="M13,-7 L15,-5 L13,-3"/>
    </g>
  </g>
</svg>