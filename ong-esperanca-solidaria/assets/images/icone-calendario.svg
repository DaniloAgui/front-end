<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="calendarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Corpo do calendário -->
  <rect x="3" y="4" width="18" height="16" rx="2" ry="2" fill="url(#calendarGradient)" stroke="#2563EB" stroke-width="1"/>
  
  <!-- Cabeçalho do calendário -->
  <rect x="3" y="4" width="18" height="4" rx="2" ry="2" fill="#1E40AF"/>
  
  <!-- Argolas superior -->
  <rect x="7" y="2" width="2" height="4" rx="1" ry="1" fill="#6B7280"/>
  <rect x="15" y="2" width="2" height="4" rx="1" ry="1" fill="#6B7280"/>
  
  <!-- Grades do calendário -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Linha 1 -->
    <rect x="5" y="10" width="2" height="1.5" rx="0.5"/>
    <rect x="8.5" y="10" width="2" height="1.5" rx="0.5"/>
    <rect x="12" y="10" width="2" height="1.5" rx="0.5"/>
    <rect x="15.5" y="10" width="2" height="1.5" rx="0.5"/>
    <rect x="19" y="10" width="2" height="1.5" rx="0.5"/>
    
    <!-- Linha 2 -->
    <rect x="5" y="13" width="2" height="1.5" rx="0.5"/>
    <rect x="8.5" y="13" width="2" height="1.5" rx="0.5"/>
    <rect x="12" y="13" width="2" height="1.5" rx="0.5"/>
    <rect x="15.5" y="13" width="2" height="1.5" rx="0.5"/>
    <rect x="19" y="13" width="2" height="1.5" rx="0.5"/>
    
    <!-- Linha 3 -->
    <rect x="5" y="16" width="2" height="1.5" rx="0.5"/>
    <rect x="8.5" y="16" width="2" height="1.5" rx="0.5"/>
    <rect x="12" y="16" width="2" height="1.5" rx="0.5" fill="#EF4444"/>
    <rect x="15.5" y="16" width="2" height="1.5" rx="0.5"/>
    <rect x="19" y="16" width="2" height="1.5" rx="0.5"/>
  </g>
</svg>