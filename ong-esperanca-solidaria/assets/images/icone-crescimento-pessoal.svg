<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="crescimentoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fundo -->
  <circle cx="24" cy="24" r="22" fill="url(#crescimentoGradient)" opacity="0.1"/>
  
  <!-- Pessoa crescendo/evoluindo -->
  <g transform="translate(24,24)">
    <!-- Gráfico de crescimento em escada -->
    <g fill="none" stroke="url(#crescimentoGradient)" stroke-width="2">
      <!-- Degraus do crescimento -->
      <path d="M-12,8 L-8,8 L-8,4 L-4,4 L-4,0 L0,0 L0,-4 L4,-4 L4,-8 L8,-8"/>
      <!-- Seta de crescimento -->
      <path d="M8,-8 L12,-12"/>
      <path d="M8,-12 L12,-12 L12,-8" stroke-linecap="round"/>
    </g>
    
    <!-- Pessoa no topo (evoluída) -->
    <g transform="translate(8,-8)" fill="url(#crescimentoGradient)">
      <!-- Cabeça -->
      <circle cx="0" cy="-3" r="2"/>
      <!-- Corpo -->
      <rect x="-1" y="-1" width="2" height="4" rx="1"/>
      <!-- Braços levantados (vitória) -->
      <line x1="-1" y1="0" x2="-3" y2="-2" stroke="url(#crescimentoGradient)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="1" y1="0" x2="3" y2="-2" stroke="url(#crescimentoGradient)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Pessoa no início (menor) -->
    <g transform="translate(-12,8)" fill="url(#crescimentoGradient)" opacity="0.6">
      <!-- Cabeça -->
      <circle cx="0" cy="-1" r="1.5"/>
      <!-- Corpo -->
      <rect x="-0.5" y="1" width="1" height="3" rx="0.5"/>
    </g>
    
    <!-- Etapas intermediárias -->
    <g fill="url(#crescimentoGradient)" opacity="0.7">
      <!-- Pessoa no meio -->
      <g transform="translate(-4,4)">
        <circle cx="0" cy="-2" r="1.7"/>
        <rect x="-0.7" y="0" width="1.4" height="3.5" rx="0.7"/>
      </g>
      
      <!-- Pessoa quase no topo -->
      <g transform="translate(0,0)">
        <circle cx="0" cy="-2.5" r="1.8"/>
        <rect x="-0.8" y="-0.5" width="1.6" height="3.8" rx="0.8"/>
      </g>
    </g>
    
    <!-- Estrelas de conquista -->
    <g fill="url(#crescimentoGradient)" opacity="0.8">
      <path d="M10,-14 L11,-12 L13,-12 L11.5,-10.5 L12,-8 L10,-9 L8,-8 L8.5,-10.5 L7,-12 L9,-12 Z"/>
    </g>
    
    <!-- Plantas crescendo (simbolismo de crescimento natural) -->
    <g stroke="url(#crescimentoGradient)" stroke-width="1" fill="none" opacity="0.5">
      <path d="M-14,12 Q-14,10 -12,8"/>
      <path d="M-10,12 Q-10,9 -8,6"/>
      <circle cx="-14" cy="12" r="0.5" fill="url(#crescimentoGradient)"/>
      <circle cx="-10" cy="12" r="0.5" fill="url(#crescimentoGradient)"/>
    </g>
  </g>
</svg>