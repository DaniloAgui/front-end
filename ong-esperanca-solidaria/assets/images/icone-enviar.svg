<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradEnviar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Envelope -->
  <rect x="2" y="5" width="14" height="10" rx="1" fill="rgba(255,255,255,0.9)" stroke="url(#gradEnviar)" stroke-width="1"/>
  
  <!-- Tampa do envelope -->
  <path d="M2 5 L9 10 L16 5" stroke="url(#gradEnviar)" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  
  <!-- Seta de envio -->
  <path d="M12 3 L15 6 L12 9" stroke="#28a745" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="7" y1="6" x2="15" y2="6" stroke="#28a745" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Brilho no envelope -->
  <ellipse cx="6" cy="8" rx="2" ry="3" fill="rgba(0,123,255,0.1)" transform="rotate(-20 6 8)"/>
</svg>