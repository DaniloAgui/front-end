<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="parceriaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fundo -->
  <circle cx="32" cy="32" r="30" fill="url(#parceriaGradient)" opacity="0.1"/>
  
  <!-- Aperto de mãos representando parceria -->
  <g transform="translate(32,32)">
    <!-- Mão esquerda (empresa) -->
    <g transform="rotate(-15)">
      <rect x="-18" y="-2" width="12" height="6" rx="3" fill="url(#parceriaGradient)"/>
      <!-- Dedos -->
      <rect x="-6" y="-4" width="2" height="3" rx="1" fill="url(#parceriaGradient)"/>
      <rect x="-4" y="-5" width="2" height="4" rx="1" fill="url(#parceriaGradient)"/>
      <rect x="-2" y="-4" width="2" height="3" rx="1" fill="url(#parceriaGradient)"/>
      <rect x="0" y="-3" width="2" height="2" rx="1" fill="url(#parceriaGradient)"/>
    </g>
    
    <!-- Mão direita (ONG) -->
    <g transform="rotate(15)">
      <rect x="6" y="-2" width="12" height="6" rx="3" fill="url(#parceriaGradient)"/>
      <!-- Dedos -->
      <rect x="4" y="-4" width="2" height="3" rx="1" fill="url(#parceriaGradient)"/>
      <rect x="2" y="-5" width="2" height="4" rx="1" fill="url(#parceriaGradient)"/>
      <rect x="0" y="-4" width="2" height="3" rx="1" fill="url(#parceriaGradient)"/>
      <rect x="-2" y="-3" width="2" height="2" rx="1" fill="url(#parceriaGradient)"/>
    </g>
    
    <!-- Conexão/união no centro -->
    <circle cx="0" cy="0" r="4" fill="url(#parceriaGradient)" opacity="0.8"/>
    
    <!-- Ícone de empresa (prédio) à esquerda -->
    <g transform="translate(-20,-12)" opacity="0.7">
      <rect x="0" y="4" width="8" height="12" fill="url(#parceriaGradient)"/>
      <rect x="1" y="6" width="1.5" height="2" fill="#ffffff"/>
      <rect x="3" y="6" width="1.5" height="2" fill="#ffffff"/>
      <rect x="5.5" y="6" width="1.5" height="2" fill="#ffffff"/>
      <rect x="1" y="9" width="1.5" height="2" fill="#ffffff"/>
      <rect x="3" y="9" width="1.5" height="2" fill="#ffffff"/>
      <rect x="5.5" y="9" width="1.5" height="2" fill="#ffffff"/>
    </g>
    
    <!-- Ícone de coração (ONG) à direita -->
    <g transform="translate(15,-12)" opacity="0.7">
      <path d="M0,4 C-2,1 -5,1 -5,5 C-5,8 0,13 5,16 C10,13 15,8 15,5 C15,1 12,1 10,4 C9,2 7,2 5,4 C3,2 1,2 0,4 Z" fill="#EF4444"/>
    </g>
    
    <!-- Setas indicando benefício mútuo -->
    <g stroke="url(#parceriaGradient)" stroke-width="1.5" fill="none" opacity="0.6">
      <!-- Seta para empresa -->
      <path d="M-8,8 Q-12,12 -16,8"/>
      <path d="M-18,6 L-16,8 L-18,10"/>
      
      <!-- Seta para ONG -->
      <path d="M8,8 Q12,12 16,8"/>
      <path d="M18,10 L16,8 L18,6"/>
    </g>
    
    <!-- Texto "WIN-WIN" pequeno -->
    <text x="0" y="20" text-anchor="middle" fill="url(#parceriaGradient)" font-family="Inter, sans-serif" font-size="4" font-weight="600" opacity="0.8">WIN-WIN</text>
  </g>
</svg>