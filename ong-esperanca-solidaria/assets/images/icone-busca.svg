<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradBusca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lupa -->
  <circle cx="8" cy="8" r="5" fill="none" stroke="url(#gradBusca)" stroke-width="2"/>
  <circle cx="8" cy="8" r="3" fill="rgba(0,123,255,0.1)"/>
  
  <!-- Cabo da lupa -->
  <line x1="14" y1="14" x2="17" y2="17" stroke="url(#gradBusca)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Reflexo na lente -->
  <ellipse cx="6.5" cy="6.5" rx="1.5" ry="2" fill="rgba(255,255,255,0.3)" transform="rotate(-45 6.5 6.5)"/>
  
  <!-- Brilho -->
  <circle cx="7" cy="7" r="0.5" fill="rgba(255,255,255,0.6)"/>
</svg>