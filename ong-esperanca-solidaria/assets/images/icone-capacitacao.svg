<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="capacitacaoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fundo -->
  <circle cx="24" cy="24" r="22" fill="url(#capacitacaoGradient)" opacity="0.1"/>
  
  <!-- Certificado/Diploma representando capacitação -->
  <g transform="translate(24,24)">
    <!-- Base do certificado -->
    <rect x="-10" y="-8" width="20" height="14" rx="2" fill="none" stroke="url(#capacitacaoGradient)" stroke-width="2"/>
    
    <!-- Linhas de texto no certificado -->
    <g stroke="url(#capacitacaoGradient)" stroke-width="1" opacity="0.7">
      <line x1="-7" y1="-5" x2="7" y2="-5"/>
      <line x1="-7" y1="-2" x2="4" y2="-2"/>
      <line x1="-7" y1="1" x2="6" y2="1"/>
    </g>
    
    <!-- Selo de certificação -->
    <circle cx="6" cy="3" r="3" fill="url(#capacitacaoGradient)" opacity="0.8"/>
    <path d="M6,1 L7,3 L6,5 L5,3 Z" fill="#ffffff"/>
    
    <!-- Chapéu de formatura -->
    <g transform="translate(0,-12)">
      <!-- Base do chapéu -->
      <ellipse cx="0" cy="0" rx="8" ry="2" fill="url(#capacitacaoGradient)"/>
      <!-- Topo do chapéu -->
      <rect x="-6" y="-3" width="12" height="3" rx="1" fill="url(#capacitacaoGradient)"/>
      <!-- Borla -->
      <line x1="6" y1="-3" x2="9" y2="-6" stroke="url(#capacitacaoGradient)" stroke-width="1"/>
      <circle cx="9" cy="-6" r="1" fill="url(#capacitacaoGradient)"/>
    </g>
    
    <!-- Livro aberto -->
    <g transform="translate(0,10)">
      <!-- Páginas do livro -->
      <path d="M-6,0 Q0,-2 6,0 L6,6 Q0,4 -6,6 Z" fill="none" stroke="url(#capacitacaoGradient)" stroke-width="1.5"/>
      <!-- Linha central -->
      <line x1="0" y1="0" x2="0" y2="6" stroke="url(#capacitacaoGradient)" stroke-width="1" opacity="0.5"/>
    </g>
    
    <!-- Estrelas de conhecimento -->
    <g fill="url(#capacitacaoGradient)" opacity="0.6">
      <path d="M-12,-2 L-11,-1 L-10,-2 L-11,-3 Z"/>
      <path d="M12,-1 L13,0 L12,1 L11,0 Z"/>
    </g>
  </g>
</svg>